# .github/workflows/frontend-cd.yaml

name: Frontend Continuous Deployment

on:
  push:
    branches: [ main ]
  # CRITICAL RUBRIC REQUIREMENT: manual "Run workflow" button
  workflow_dispatch:

defaults:
  run:
    working-directory: starter/frontend

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          CI: true

  build-and-deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # ---- GOTCHA FIX: Auth using 3 temporary Lab credentials ----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

      # ---- GOTCHA FIX: Dynamically fetch backend's Classic LB URL ----
      - name: Get backend LoadBalancer URL
        id: get-backend-url
        run: |
          echo "Waiting for backend LoadBalancer hostname..."
          for i in $(seq 1 30); do
            HOSTNAME=$(kubectl get svc backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$HOSTNAME" ]; then
              echo "Found backend LB hostname: $HOSTNAME"
              echo "url=http://$HOSTNAME" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i/30: not ready yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Timed out waiting for backend LoadBalancer hostname."
          echo "Make sure the backend Service has been deployed to EKS at least once."
          exit 1

      - name: Build and push frontend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          MOVIE_API_URL: ${{ steps.get-backend-url.outputs.url }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=$MOVIE_API_URL \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Set new image in deployment manifest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: frontend|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|" k8s/deployment.yaml

      - name: Deploy to EKS
        run: kubectl apply -k k8s/