name: Frontend Continuous Deployment

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
  uses: actions/checkout@v4

- name: Configure AWS credentials
  uses: aws-actions/configure-aws-credentials@v4
  with:
    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    aws-region: ${{ secrets.AWS_REGION }}

- name: Login to Amazon ECR
  id: login-ecr
  uses: aws-actions/amazon-ecr-login@v2
  with:
    mask-password: true


      - name: Build, tag, and push frontend image
        run: |
          docker build --build-arg REACT_APP_MOVIE_API_URL=http://backend:5000 -t ${{ secrets.FRONTEND_ECR_REPO }}:latest ./frontend
          docker push ${{ secrets.FRONTEND_ECR_REPO }}:latest

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy frontend to EKS
        run: |
          kubectl apply -f setup/k8s/frontend-deployment.yaml
          kubectl apply -f setup/k8s/frontend-service.yaml
